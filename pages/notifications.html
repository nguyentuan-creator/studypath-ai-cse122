<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Thông báo — StudyPath AI</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/notifications.css">
</head>
<body class="page-notifications">
<div class="app-shell">

  <aside class="sidebar">
    <a class="brand" href="student-dashboard.html">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </span>
      <span>StudyPath AI</span>
    </a>
    <nav class="sidebar-nav" aria-label="Điều hướng chính">
      <a class="nav-item" href="student-dashboard.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        <span>Tổng quan</span>
      </a>
      <a class="nav-item" href="student-semester-plan.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
        <span>Kế hoạch học kỳ</span>
      </a>
      <a class="nav-item" href="student-ai-roadmap.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
        <span>Lộ trình AI</span>
      </a>
      <a class="nav-item active" href="notifications.html" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span>Thông báo</span>
      </a>
      <a class="nav-item" href="settings.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/></svg>
        <span>Cài đặt</span>
      </a>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-search">
        <input type="search" class="form-input" placeholder="Tìm sinh viên, kế hoạch, học phần…" aria-label="Tìm kiếm nhanh">
      </div>
      <div class="topbar-actions">
        <a class="icon-btn notif-bell" href="notifications.html" aria-label="Thông báo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="notif-dot" id="bellDot" aria-hidden="true"></span>
        </a>
        <div class="topbar-user">
          <span class="avatar avatar-sm" aria-hidden="true">NA</span>
          <span class="topbar-user-info">
            <span class="topbar-user-name">Nguyễn Văn An</span>
            <span class="topbar-user-role">Sinh viên</span>
          </span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="page-head">
        <div>
          <h1>Thông báo</h1>
          <p class="text-muted notif-summary" id="unreadSummary" role="status">Đang tải…</p>
        </div>
        <button type="button" class="btn notif-markall" id="markAllRead">Đánh dấu tất cả đã đọc</button>
      </div>

      <section class="card notif-card" aria-label="Danh sách thông báo">
        <div class="notif-skeleton" id="notifSkeleton" aria-hidden="true">
          <div class="notif-skel-row">
            <div class="skeleton notif-skel-ic"></div>
            <div class="notif-skel-lines">
              <div class="skeleton notif-skel-l1"></div>
              <div class="skeleton notif-skel-l2"></div>
            </div>
          </div>
          <div class="notif-skel-row">
            <div class="skeleton notif-skel-ic"></div>
            <div class="notif-skel-lines">
              <div class="skeleton notif-skel-l1"></div>
              <div class="skeleton notif-skel-l2"></div>
            </div>
          </div>
          <div class="notif-skel-row">
            <div class="skeleton notif-skel-ic"></div>
            <div class="notif-skel-lines">
              <div class="skeleton notif-skel-l1"></div>
              <div class="skeleton notif-skel-l2"></div>
            </div>
          </div>
        </div>

        <div class="notif-error hidden" id="notifError" role="alert">
          <div class="notif-error-text">Không tải được thông báo</div>
          <button type="button" class="btn btn-secondary btn-sm" id="retryLoad">Thử lại</button>
        </div>

        <div class="empty-state hidden" id="notifEmpty">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <p class="notif-empty-text">Chưa có thông báo nào</p>
        </div>

        <ul class="notif-list" id="notifList"></ul>
      </section>
    </main>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script src="../js/modules/notifications.js"></script>
</body>
</html>
