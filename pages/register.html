<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script src="../js/theme.js?v=20261026g"></script>
<title>Tạo tài khoản — StudyPath AI</title>
<link rel="stylesheet" href="../css/base.css?v=20261026g">
<link rel="stylesheet" href="../css/responsive.css?v=20261026g">
<link rel="stylesheet" href="../css/register.css?v=20261026g">
<link rel="stylesheet" href="../css/style.css?v=20261026g">
</head>
<body class="page-register">
<main class="auth-page">
  <section class="auth-card" aria-labelledby="registerTitle">
    <div class="auth-brand">
      <span class="auth-brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </span>
      <span class="auth-brand-name">StudyPath AI</span>
    </div>

    <h1 class="auth-title" id="registerTitle">Tạo tài khoản</h1>
    <p class="auth-subtitle">Dành cho sinh viên. Cố vấn và quản trị viên được cấp tài khoản bởi hệ thống.</p>

    <form class="auth-form" id="registerForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="regName">Họ và tên <span class="auth-required" aria-hidden="true">*</span></label>
        <input type="text" id="regName" name="name" class="form-input" placeholder="Nguyễn Văn An"
               autocomplete="name" required>
        <p class="reg-error hidden" id="regNameError" role="alert"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email <span class="auth-required" aria-hidden="true">*</span></label>
        <input type="email" id="regEmail" name="email" class="form-input" placeholder="ten@truong.edu.vn"
               autocomplete="email" autocapitalize="none" spellcheck="false" required>
        <p class="reg-error hidden" id="regEmailError" role="alert"></p>
      </div>

      <div class="reg-grid">
        <div class="form-group">
          <label class="form-label" for="regPassword">Mật khẩu <span class="auth-required" aria-hidden="true">*</span></label>
          <input type="password" id="regPassword" name="password" class="form-input" placeholder="••••••••"
                 autocomplete="new-password" required>
          <p class="reg-error hidden" id="regPasswordError" role="alert"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="regConfirm">Nhập lại mật khẩu <span class="auth-required" aria-hidden="true">*</span></label>
          <input type="password" id="regConfirm" name="confirm" class="form-input" placeholder="••••••••"
                 autocomplete="new-password" required>
          <p class="reg-error hidden" id="regConfirmError" role="alert"></p>
        </div>
      </div>

      <div class="reg-grid">
        <div class="form-group">
          <label class="form-label" for="regStudentId">MSSV <span class="reg-optional">(tùy chọn)</span></label>
          <input type="text" id="regStudentId" name="studentId" class="form-input" placeholder="22110005"
                 inputmode="numeric">
        </div>
        <div class="form-group">
          <label class="form-label" for="regProgram">Chương trình</label>
          <select id="regProgram" name="program" class="form-select">
            <option value="" selected>Chọn chương trình</option>
            <option value="cntt-k17">Công nghệ thông tin (K17)</option>
            <option value="khmt-k17">Khoa học máy tính (K17)</option>
            <option value="ktpm-k17">Kỹ thuật phần mềm (K17)</option>
            <option value="attt-k17">An toàn thông tin (K17)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="reg-terms" for="regAgree">
          <input type="checkbox" id="regAgree" name="agree" required>
          <span>Tôi đồng ý với điều khoản sử dụng và chính sách dữ liệu</span>
        </label>
      </div>

      <p class="reg-error hidden" id="regFormError" role="alert"></p>

      <button type="submit" class="btn btn-primary auth-submit" id="regSubmit" disabled>
        <span class="auth-spinner" aria-hidden="true"></span>
        <span class="auth-submit-label">Tạo tài khoản</span>
      </button>
    </form>

    <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </section>
</main>

<script src="../js/main.js?v=20261026g"></script>
<script src="../js/api.js?v=20261026g"></script>
<script src="../js/modules/auth-register.js?v=20261026g"></script>
</body>
</html>
