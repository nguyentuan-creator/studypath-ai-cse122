<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/theme.js?v=20261026g"></script>
  <title>Hồ sơ cá nhân | StudyPath AI</title>
  <link rel="stylesheet" href="../css/base.css?v=20261026g">
  <link rel="stylesheet" href="../css/responsive.css?v=20261026g">
  <link rel="stylesheet" href="../css/profile.css?v=20261026g">
</head>
<body data-page="profile">
  <header class="app-header">
    <button type="button" class="icon-btn menu-btn" data-shell="menu" aria-label="Mở menu" aria-controls="app-sidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <a class="brand" href="student-dashboard.html" data-shell="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 2 8l10 6 10-6-10-6z"></path>
          <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"></path>
        </svg>
      </span>
      <span>StudyPath AI</span>
    </a>

    <div class="header-actions">
      <a class="icon-btn" href="notifications.html" aria-label="Thông báo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="bell-dot" aria-hidden="true"></span>
      </a>
      <div class="header-user">
        <div class="user-name">
          <span data-shell-user="name"></span>
          <span class="user-role" data-shell-user="meta"></span>
        </div>
        <span class="avatar avatar-sm" data-shell-user="avatar" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="app-sidebar">
      <nav class="sidebar-nav" aria-label="Điều hướng chính" data-shell="nav"></nav>
    </aside>

    <main class="main-content">
        <div class="page-head">
          <div>
            <h1>Hồ sơ cá nhân</h1>
            <p class="text-muted">Thông tin tài khoản của bạn</p>
          </div>
        </div>

        <div class="grid-sidebar">
          <form id="profile-form" novalidate>
            <section class="card mb-2" aria-labelledby="info-heading">
              <div class="card-head">
                <h2 id="info-heading">Thông tin cá nhân</h2>
                <p class="text-sm text-muted">Trường có nhãn "Khóa" chỉ quản trị viên được sửa</p>
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label" for="full-name">Họ và tên <span class="required" aria-hidden="true">*</span></label>
                  <input type="text" id="full-name" class="form-input" value="Hứa Đình Kiên" required>
                  <p class="form-error" aria-live="polite"></p>
                </div>
                <div class="form-group">
                  <label class="form-label" for="email">Email</label>
                  <div class="input-locked">
                    <input type="email" id="email" class="form-input" value="kien.hua@studypath.edu.vn" disabled>
                    <span class="tag tag-gray">Khóa</span>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="student-id">MSSV</label>
                  <div class="input-locked">
                    <input type="text" id="student-id" class="form-input" value="2551060707" disabled>
                    <span class="tag tag-gray">Khóa</span>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="program">Chương trình</label>
                  <input type="text" id="program" class="form-input" value="Công nghệ thông tin (K17)" disabled>
                </div>
                <div class="form-group">
                  <label class="form-label" for="year">Năm học</label>
                  <input type="text" id="year" class="form-input" value="Năm 3">
                </div>
              </div>
            </section>

            <section class="card mb-2" aria-labelledby="password-heading">
              <div class="card-head">
                <h2 id="password-heading">Đổi mật khẩu</h2>
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label" for="current-password">Mật khẩu hiện tại</label>
                  <input type="password" id="current-password" class="form-input" placeholder="••••••••" autocomplete="current-password">
                  <p class="form-error" aria-live="polite"></p>
                </div>
                <div class="form-group">
                  <label class="form-label" for="new-password">Mật khẩu mới</label>
                  <input type="password" id="new-password" class="form-input" placeholder="••••••••" autocomplete="new-password">
                  <p class="form-error" aria-live="polite"></p>
                </div>
              </div>
            </section>

            <div id="save-success" class="alert alert-success hidden" role="alert">
              Đã lưu thay đổi thành công.
            </div>

            <div class="page-actions">
              <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
              <button type="button" id="btn-reset" class="btn btn-secondary">Hoàn tác</button>
            </div>
          </form>

          <aside class="card profile-summary" aria-label="Tóm tắt hồ sơ">
            <span class="avatar avatar-lg" data-profile-summary="avatar">K</span>
            <h2 data-profile-summary="name">Hứa Đình Kiên</h2>
            <span class="tag tag-blue" data-profile-summary="role">Sinh viên</span>
            <p class="text-sm text-muted" data-profile-summary="meta">MSSV 2551060707 · CNTT (K17)</p>
          </aside>
        </div>
      </main>
  </div>

  <div class="sidebar-overlay" data-shell="overlay" hidden></div>

  <script src="../js/api.js?v=20261026g"></script>
  <script src="../js/shell.js?v=20261026g"></script>
  <script src="../js/profile.js?v=20261026g"></script>
</body>
</html>
