<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | StudyPath AI</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <a class="auth-brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 2 8l10 6 10-6-10-6z"></path>
            <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"></path>
          </svg>
        </span>
        <span class="auth-brand-name">StudyPath AI</span>
      </a>

      <h1>Quên mật khẩu</h1>
      <p class="text-muted auth-sub">Nhập email đã đăng ký — chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>

      <div id="send-success" class="alert alert-success hidden" role="alert" aria-live="polite">
        Đã gửi liên kết đặt lại mật khẩu. Vui lòng kiểm tra hộp thư của bạn.
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email <span class="required" aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" class="form-input" placeholder="ten@truong.edu.vn" autocomplete="email">
          <p class="form-error" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Gửi liên kết đặt lại</button>
      </form>

      <a class="auth-back" href="login.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Về trang đăng nhập
      </a>
    </div>
  </main>

  <script src="../js/forgot-password.js"></script>
</body>
</html>
